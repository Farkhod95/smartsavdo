<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GPS Live Table</title>
  <style>
    :root{
      --bg:#0b1220;
      --text:#e7eefc;
      --muted:#a7b4d1;
      --stroke:rgba(255,255,255,.10);
      --ok:#22c55e;
      --bad:#ef4444;
      --warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(1200px 500px at 20% 0%, rgba(56,189,248,.12), transparent 55%),
        radial-gradient(900px 450px at 90% 10%, rgba(34,197,94,.12), transparent 50%),
        var(--bg);
      color: var(--text);
    }
    .wrap{max-width:1400px;margin:0 auto;padding:18px;}
    .top{
      display:flex;gap:12px;align-items:flex-start;justify-content:space-between;
      margin-bottom:12px;flex-wrap:wrap;
    }
    .title{display:flex;flex-direction:column;gap:6px;min-width:260px}
    .title h1{margin:0;font-size:18px;letter-spacing:.2px}
    .title p{margin:0;color:var(--muted);font-size:13px;line-height:1.3}
    .pill{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border:1px solid var(--stroke);border-radius:999px;
      background: rgba(255,255,255,.03);
      font-size:13px;color:var(--muted);
      user-select:none;
      white-space:nowrap;
    }
    .dot{width:10px;height:10px;border-radius:50%;}
    .dot.ok{background:var(--ok); box-shadow:0 0 0 4px rgba(34,197,94,.15);}
    .dot.bad{background:var(--bad); box-shadow:0 0 0 4px rgba(239,68,68,.12);}
    .dot.warn{background:var(--warn); box-shadow:0 0 0 4px rgba(245,158,11,.12);}

    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    button{
      padding:9px 12px;border-radius:12px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      color: var(--text);
      cursor:pointer;
    }
    button:hover{background: rgba(255,255,255,.08);}
    input{
      padding:9px 12px;border-radius:12px;
      border:1px solid var(--stroke);
      background: rgba(0,0,0,.16);
      color: var(--text);
      outline:none;
      min-width:280px;
    }
    input::placeholder{color:rgba(231,238,252,.55)}
    code{color:#b9c7ea}

    .card{
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border-radius:16px;
      padding:12px;
      overflow:hidden;
    }

    .meta{
      display:flex;gap:10px;flex-wrap:wrap;align-items:center;
      margin:10px 0 12px 0;
      color:var(--muted);
      font-size:12px;
    }
    .badge{
      display:inline-flex;align-items:center;gap:8px;
      padding:5px 10px;border-radius:999px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.03);
      color: var(--muted);
      font-size:12px;
    }

    .table-wrap{
      border:1px solid var(--stroke);
      border-radius:14px;
      overflow:auto;
      background: rgba(0,0,0,.12);
      max-height: 72vh;
    }
    table{
      width:100%;
      border-collapse:separate;
      border-spacing:0;
      min-width: 980px;
      font-size:13px;
    }
    thead th{
      position:sticky;
      top:0;
      z-index:2;
      background: rgba(15,26,46,.92);
      backdrop-filter: blur(6px);
      border-bottom:1px solid rgba(255,255,255,.12);
      padding:10px 10px;
      text-align:left;
      white-space:nowrap;
      color: var(--muted);
      font-weight:800;
    }
    tbody td{
      border-bottom:1px solid rgba(255,255,255,.06);
      padding:9px 10px;
      vertical-align:top;
      white-space:nowrap;
      max-width:420px;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    tbody tr:hover td{
      background: rgba(255,255,255,.03);
    }
    .small{
      font-size:12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="top">
    <div class="title">
      <h1>GPS Live Monitoring (Table)</h1>
      <p>Websocket: <code id="wsUrlText">-</code></p>
      <div class="pill">
        <span class="dot warn" id="connDot"></span>
        <span id="connText">Ulanmoqda...</span>
      </div>
    </div>

    <div class="controls">
      <input id="search" placeholder="Jadval bo‘yicha qidirish: imei, plate, brand..." />
      <button id="btnReconnect" type="button">Reconnect</button>
      <button id="btnClear" type="button">Tozalash</button>
    </div>
  </div>

  <div class="card">
    <div class="meta">
      <span class="badge">Rows: <b id="rowCount">0</b></span>
      <span class="badge">Columns: <b id="colCount">0</b></span>
      <span class="badge">Last seen: <b id="lastSeen">—</b></span>
      <span class="badge">Max rows: <b id="maxRows">500</b></span>
    </div>

    <div class="table-wrap">
      <table id="tbl">
        <thead>
          <tr id="theadRow">
            <th>#</th>
            <th>time</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ===== WS URL =====
  const WS_PATH = "/ws/gps-url/";
  const WS_URL = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + WS_PATH;
  {#const WS_URL = "ws://192.168.168.149:8080/ws/gps-url/"#}
  {#const WS_URL = "ws://192.168.168.149:8080/ws/gps-url/"#}
  document.getElementById("wsUrlText").textContent = WS_URL;

  // ===== settings =====
  const MAX_ROWS = 500;
  document.getElementById("maxRows").textContent = MAX_ROWS;

  // ===== helpers =====
  const el = (id) => document.getElementById(id);

  function setConn(state, text){
    const dot = el("connDot");
    dot.classList.remove("ok","bad","warn");
    dot.classList.add(state);
    el("connText").textContent = text;
  }

  function fmtTime(d=new Date()){
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#39;");
  }

  function toCellValue(v){
    if (v === null || v === undefined) return "";
    if (typeof v === "string") return v;
    if (typeof v === "number" || typeof v === "boolean") return String(v);
    try { return JSON.stringify(v); } catch { return String(v); }
  }

  // ===== table state =====
  const theadRow = el("theadRow");
  const tbody = el("tbody");

  let columns = ["#","time"];   // base columns
  let dataRows = [];           // store rows for search
  let rowIndex = 0;

  function ensureColumnsFromMetric(metric){
    // metricdagi keylar jadval ustuniga qo'shilib boradi
    const keys = Object.keys(metric || {}).sort((a,b)=>a.localeCompare(b));
    let added = false;

    for (const k of keys){
      if (!columns.includes(k)){
        columns.push(k);
        added = true;
      }
    }

    if (added) renderHeader();
  }

  function renderHeader(){
    theadRow.innerHTML = "";
    for (const col of columns){
      const th = document.createElement("th");
      th.textContent = col;
      theadRow.appendChild(th);
    }
    el("colCount").textContent = columns.length;
  }

  function renderBody(){
    const q = (el("search").value || "").trim().toLowerCase();

    tbody.innerHTML = "";
    const rowsToRender = q
      ? dataRows.filter(r => r._search.includes(q))
      : dataRows;

    for (const r of rowsToRender){
      const tr = document.createElement("tr");
      for (const col of columns){
        const td = document.createElement("td");
        td.title = r[col] ?? "";
        td.innerHTML = escapeHtml(r[col] ?? "");
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    el("rowCount").textContent = rowsToRender.length;
  }

  function addRow(metric){
    // metric row object
    rowIndex += 1;
    const now = new Date();
    const r = {
      "#": String(rowIndex),
      "time": fmtTime(now),
    };

    // hamma col qiymatlarini joylab chiqamiz
    for (const col of columns){
      if (col === "#" || col === "time") continue;
      r[col] = ""; // default
    }

    for (const [k,v] of Object.entries(metric || {})){
      r[k] = toCellValue(v);
    }

    // search uchun barcha qiymatlarni birlashtiramiz
    r._search = Object.values(r).join(" ").toLowerCase();

    // yangi row yuqoriga qo'shish
    dataRows.unshift(r);

    // limit
    if (dataRows.length > MAX_ROWS){
      dataRows.length = MAX_ROWS;
    }

    el("lastSeen").textContent = now.toLocaleString();
    renderBody();
  }

  // init header
  renderHeader();

  // ===== WebSocket connect + auto reconnect =====
  let ws = null;
  let reconnectTimer = null;
  let reconnectAttempt = 0;

  function connect(){
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

    setConn("warn", "Ulanmoqda...");

    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      reconnectAttempt = 0;
      setConn("ok", "Ulandi");
    };

    ws.onmessage = (event) => {
      try{
        const data = JSON.parse(event.data);

        // ✅ 2 format:
        // 1) {type:"metric", metric:{...}}
        // 2) {...}
        const metric = (data && typeof data === "object" && data.metric) ? data.metric : data;

        if (!metric || typeof metric !== "object"){
          return;
        }

        ensureColumnsFromMetric(metric);
        addRow(metric);
      }catch(e){
        // ignore parse errors
      }
    };

    ws.onerror = () => {
      setConn("bad", "Xatolik");
    };

    ws.onclose = () => {
      setConn("bad", "Uzildi");

      const delay = Math.min(10000, 1000 * Math.pow(2, reconnectAttempt++));
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, delay);
    };
  }

  // controls
  el("btnReconnect").addEventListener("click", () => {
    try { if (ws) ws.close(); } catch(e){}
    setTimeout(connect, 200);
  });

  el("btnClear").addEventListener("click", () => {
    dataRows = [];
    rowIndex = 0;
    el("rowCount").textContent = "0";
    el("lastSeen").textContent = "—";
    renderBody();
  });

  el("search").addEventListener("input", () => {
    renderBody();
  });

  // start
  connect();
</script>
</body>
</html>
